<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
  <meta name="theme-color" content="#fff5f7">
  <title>Sorry • Arya Singh 😋</title>
  <style>
    /* ——— soft, dreamy base ——— */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      /* smooth scaling */
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh; /* dynamic viewport for mobile */
      background: linear-gradient(145deg, #fff5f7 0%, #ffe9f0 100%);
      font-family: 'Segoe UI', 'Quicksand', system-ui, -apple-system, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(0.75rem, 3vw, 2rem);
      position: relative;
      overflow-x: hidden;
      /* safe area for notched phones */
      padding-top: max(0.75rem, env(safe-area-inset-top));
      padding-bottom: max(0.75rem, env(safe-area-inset-bottom));
      padding-left: max(0.75rem, env(safe-area-inset-left));
      padding-right: max(0.75rem, env(safe-area-inset-right));
    }

    /* floating hearts / petals background */
    .floating-hearts {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      overflow: hidden;
    }

    .floating-hearts span {
      position: absolute;
      display: block;
      font-size: clamp(1.1rem, 2.5vw, 1.9rem);
      opacity: 0.25;
      animation: floatUp 10s infinite linear;
      filter: drop-shadow(0 8px 12px rgba(255, 160, 180, 0.3));
      will-change: transform, opacity;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(110vh) rotate(0deg) scale(0.8);
        opacity: 0.1;
      }
      30% { opacity: 0.4; }
      80% { opacity: 0.3; }
      100% {
        transform: translateY(-20vh) rotate(360deg) scale(1.1);
        opacity: 0;
      }
    }

    /* ——— main card ——— */
    .sorry-card {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 650px;

      /* fluid padding — scales smoothly on every device */
      padding: clamp(1.6rem, 5vw, 3.2rem) clamp(1rem, 4vw, 2.2rem) clamp(1.4rem, 4.5vw, 3rem);

      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: clamp(36px, 6vw, 64px) clamp(36px, 6vw, 64px) clamp(36px, 6vw, 64px) clamp(14px, 3vw, 24px);
      box-shadow:
        0 30px 50px -15px rgba(230, 120, 150, 0.3),
        0 0 0 1.5px rgba(255, 255, 255, 0.7) inset,
        0 0 0 2px rgba(255, 200, 215, 0.4);

      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      transition: transform 0.3s ease;
      overflow: hidden;
      word-break: break-word;
    }

    @media (hover: hover) {
      .sorry-card:hover {
        transform: scale(1.01);
      }
    }

    /* ——— nickname tag ——— */
    .nickname {
      display: inline-flex;
      align-items: center;
      gap: clamp(0.3rem, 1.2vw, 0.6rem);
      background: #fff0f3;
      border-radius: 100px;
      padding: clamp(0.35rem, 1.2vw, 0.5rem) clamp(0.9rem, 3vw, 1.4rem) clamp(0.35rem, 1.2vw, 0.5rem) clamp(0.7rem, 2.5vw, 1rem);
      box-shadow: 0 6px 18px rgba(255, 150, 170, 0.25);
      margin-bottom: clamp(1rem, 4vw, 1.8rem);
      border: 1px solid #ffdae3;
      max-width: 100%;
    }

    .nickname span {
      font-size: clamp(1rem, 3.5vw, 1.5rem);
      line-height: 1;
      flex-shrink: 0;
    }

    .nickname h2 {
      font-size: clamp(0.9rem, 3.2vw, 1.3rem);
      letter-spacing: 0.5px;
      background: linear-gradient(135deg, #c34b6b, #a82e4e);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 700;
      white-space: nowrap;
    }

    /* ——— big name ——— */
    .name-block {
      margin-bottom: clamp(0.3rem, 1.5vw, 0.75rem);
      width: 100%;
    }

    .name-block .main-name {
      font-size: clamp(1.9rem, 9vw, 3.4rem);
      font-weight: 800;
      line-height: 1.15;
      letter-spacing: -0.5px;
      color: #6b2e41;
      text-shadow: 0 4px 12px rgba(255, 180, 200, 0.6);
      word-break: break-word;
    }

    .name-block .sub-name {
      display: block;
      font-size: clamp(0.7rem, 2.6vw, 1.2rem);
      font-weight: 400;
      letter-spacing: clamp(1.5px, 0.7vw, 3px);
      color: #d88a9c;
      margin-top: clamp(0.15rem, 1vw, 0.3rem);
      text-transform: uppercase;
      opacity: 0.9;
    }

    /* ——— sorry message ——— */
    .sorry-message {
      margin: clamp(1.2rem, 5vw, 2.2rem) 0 clamp(0.8rem, 3vw, 1.5rem);
      font-size: clamp(1.3rem, 5vw, 2.3rem);
      font-weight: 600;
      color: #9e3d58;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: clamp(0.1rem, 0.8vw, 0.3rem);
      width: 100%;
    }

    .sorry-message .sorry-word {
      font-size: clamp(2.5rem, 15vw, 4.8rem);
      font-weight: 900;
      line-height: 1;
      background: linear-gradient(145deg, #d64f72, #b32e53);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 6px 12px rgba(200, 70, 100, 0.3));
      letter-spacing: clamp(1px, 1vw, 3px);
      margin-bottom: clamp(0.1rem, 0.8vw, 0.25rem);
      animation: softPulse 3s infinite ease-in-out;
    }

    .sorry-message .heart-icon {
      font-size: clamp(1.4rem, 6vw, 2.4rem);
      line-height: 1;
      margin-top: clamp(0.05rem, 0.6vw, 0.2rem);
      filter: drop-shadow(0 0 8px #ffb3c6);
    }

    /* ——— small decorative dots ——— */
    .dot-divider {
      display: flex;
      gap: clamp(0.4rem, 2vw, 0.7rem);
      margin: clamp(0.5rem, 2.5vw, 1rem) 0 clamp(0.7rem, 2.8vw, 1.2rem);
      align-items: center;
      justify-content: center;
    }

    .dot-divider i {
      display: block;
      width: clamp(6px, 1.5vw, 8px);
      height: clamp(6px, 1.5vw, 8px);
      border-radius: 50%;
      background: #f3b6c6;
      opacity: 0.7;
    }

    .dot-divider i:nth-child(2) {
      background: #e48aa2;
      width: clamp(9px, 2.2vw, 12px);
      height: clamp(9px, 2.2vw, 12px);
      opacity: 0.9;
    }

    /* ——— minimal foot note ——— */
    .footnote {
      font-size: clamp(0.75rem, 2.8vw, 0.95rem);
      color: #b97c8b;
      letter-spacing: clamp(0.5px, 0.3vw, 1px);
      margin-top: clamp(0.7rem, 3vw, 1.2rem);
      font-weight: 400;
      background: rgba(255, 240, 245, 0.7);
      padding: clamp(0.4rem, 1.5vw, 0.55rem) clamp(0.9rem, 3.5vw, 1.5rem);
      border-radius: 100px;
      backdrop-filter: blur(4px);
      border: 1px solid #ffe2ea;
      max-width: 100%;
    }

    /* ——— soft pulse animation ——— */
    @keyframes softPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.03); }
    }

    /* =====================================================
       CUSTOM RESOLUTION BREAKPOINTS
       — designed so every device feels intentional —
       ===================================================== */

    /* 🌟 SMARTWATCH & ULTRA SMALL (≤ 280px) */
    @media (max-width: 280px) {
      body { padding: 0.4rem; }
      .sorry-card {
        padding: 1.2rem 0.7rem 1rem;
        border-radius: 28px 28px 28px 12px;
      }
      .nickname h2 { font-size: 0.75rem; white-space: normal; }
      .nickname { gap: 0.2rem; padding: 0.3rem 0.6rem; }
      .name-block .main-name { font-size: 1.5rem; }
      .sorry-message .sorry-word { font-size: 2rem; }
      .footnote { font-size: 0.65rem; padding: 0.3rem 0.6rem; }
    }

    /* 📱 SMALL PHONES (281px – 360px) */
    @media (min-width: 281px) and (max-width: 360px) {
      body { padding: 0.6rem; }
      .sorry-card {
        padding: 1.5rem 0.9rem 1.4rem;
        border-radius: 34px 34px 34px 14px;
      }
      .name-block .main-name { font-size: 1.9rem; }
      .sorry-message .sorry-word { font-size: 2.6rem; }
      .footnote { font-size: 0.72rem; }
    }

    /* 📱 STANDARD PHONES (361px – 480px) */
    @media (min-width: 361px) and (max-width: 480px) {
      body { padding: 0.75rem; }
      .sorry-card {
        padding: 1.8rem 1.1rem 1.6rem;
        border-radius: 42px 42px 42px 16px;
      }
      .name-block .main-name { font-size: 2.3rem; }
      .sorry-message .sorry-word { font-size: 3.2rem; }
      .sorry-message { font-size: 1.6rem; }
    }

    /* 📱 LARGE PHONES / SMALL TABLETS (481px – 640px) */
    @media (min-width: 481px) and (max-width: 640px) {
      body { padding: 1rem; }
      .sorry-card {
        padding: 2.2rem 1.4rem 2rem;
        border-radius: 48px 48px 48px 18px;
      }
      .name-block .main-name { font-size: 2.7rem; }
      .sorry-message .sorry-word { font-size: 3.6rem; }
    }

    /* 💻 TABLETS PORTRAIT (641px – 820px) */
    @media (min-width: 641px) and (max-width: 820px) {
      .sorry-card { max-width: 600px; padding: 2.6rem 1.8rem 2.4rem; }
      .name-block .main-name { font-size: 3rem; }
      .sorry-message .sorry-word { font-size: 4rem; }
    }

    /* 💻 SMALL LAPTOPS (821px – 1100px) */
    @media (min-width: 821px) and (max-width: 1100px) {
      .sorry-card { max-width: 620px; padding: 2.8rem 2rem 2.6rem; }
      .name-block .main-name { font-size: 3.1rem; }
      .sorry-message .sorry-word { font-size: 4.2rem; }
    }

    /* 🖥️ STANDARD LAPTOPS / DESKTOPS (1101px – 1440px) */
    @media (min-width: 1101px) and (max-width: 1440px) {
      .sorry-card { max-width: 650px; padding: 3rem 2.2rem 2.8rem; }
      .name-block .main-name { font-size: 3.2rem; }
      .sorry-message .sorry-word { font-size: 4.5rem; }
    }

    /* 🖥️ LARGE DESKTOPS / 2K (1441px – 1920px) */
    @media (min-width: 1441px) and (max-width: 1920px) {
      .sorry-card {
        max-width: 700px;
        padding: 3.4rem 2.5rem 3.2rem;
        border-radius: 72px 72px 72px 26px;
      }
      .name-block .main-name { font-size: 3.6rem; }
      .sorry-message .sorry-word { font-size: 5rem; }
      .sorry-message { font-size: 2.6rem; }
    }

    /* 🖥️ ULTRA-WIDE / 4K & above (> 1920px) */
    @media (min-width: 1921px) {
      .sorry-card {
        max-width: 800px;
        padding: 4rem 3rem 3.6rem;
        border-radius: 80px 80px 80px 28px;
      }
      .name-block .main-name { font-size: 4.2rem; }
      .sorry-message .sorry-word { font-size: 6rem; }
      .sorry-message { font-size: 3rem; }
      .nickname h2 { font-size: 1.6rem; }
      .nickname span { font-size: 1.8rem; }
      .footnote { font-size: 1.1rem; }
    }

    /* 🍎 LANDSCAPE PHONE MODE (short height) */
    @media (max-height: 500px) and (orientation: landscape) {
      body {
        align-items: flex-start;
        padding-top: max(0.5rem, env(safe-area-inset-top));
        padding-bottom: max(0.5rem, env(safe-area-inset-bottom));
        overflow-y: auto;
      }
      .sorry-card {
        padding: 1rem 1.5rem;
        border-radius: 36px;
        margin: auto 0;
      }
      .nickname { margin-bottom: 0.6rem; padding: 0.3rem 0.9rem; }
      .name-block .main-name { font-size: clamp(1.6rem, 5vw, 2.2rem); }
      .sorry-message { margin: 0.7rem 0 0.4rem; }
      .sorry-message .sorry-word { font-size: clamp(2rem, 7vw, 2.8rem); }
      .dot-divider { margin: 0.4rem 0 0.5rem; }
      .footnote { margin-top: 0.5rem; padding: 0.3rem 0.9rem; }
    }

    /* 📐 FOLDABLE / SQUARE SCREENS (aspect ratio ~1:1) */
    @media (min-aspect-ratio: 9/10) and (max-aspect-ratio: 11/10) and (min-width: 400px) {
      .sorry-card { max-width: 90vw; }
    }

    /* 🔇 REDUCED MOTION — respect accessibility */
    @media (prefers-reduced-motion: reduce) {
      .floating-hearts span,
      .sorry-word {
        animation: none;
      }
      .floating-hearts span {
        opacity: 0.15;
      }
      .sorry-card { transition: none; }
    }

    /* 🌙 DARK MODE (optional soft dark) */
    @media (prefers-color-scheme: dark) {
      body {
        background: linear-gradient(145deg, #2a1d22 0%, #3d2831 100%);
      }
      .sorry-card {
        background: rgba(50, 35, 42, 0.8);
        box-shadow:
          0 30px 50px -15px rgba(0, 0, 0, 0.5),
          0 0 0 1.5px rgba(255, 200, 215, 0.15) inset,
          0 0 0 2px rgba(255, 150, 180, 0.2);
      }
      .nickname {
        background: #3a2830;
        border-color: #5a3a48;
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.3);
      }
      .name-block .main-name {
        color: #ffd9e3;
        text-shadow: 0 4px 12px rgba(180, 80, 110, 0.5);
      }
      .name-block .sub-name { color: #e8a8b8; }
      .sorry-message { color: #f0b6c4; }
      .footnote {
        background: rgba(70, 45, 55, 0.7);
        color: #e8b6c4;
        border-color: #5a3a48;
      }
      .dot-divider i { background: #a86a7c; }
      .dot-divider i:nth-child(2) { background: #d888a0; }
    }
  </style>
</head>
<body>

  <!-- floating hearts & petals (pure decoration) -->
  <div class="floating-hearts" aria-hidden="true">
    <span>🌷</span>
    <span>🤍</span>
    <span>🫂</span>
    <span>💗</span>
    <span>🌷</span>
    <span>🌻</span>
    <span>😋</span>
  </div>

  <!-- main apology card -->
  <div class="sorry-card" role="main" aria-label="Sorry message for Arya Singh">

    <!-- nickname tag: aalu & aryuu -->
    <div class="nickname">
      <span></span>
      <h2>Aalu · Aryuu</h2>
      <span>🌷</span>
    </div>

    <!-- full name (Arya Singh) -->
    <div class="name-block">
      <div class="main-name">Arya Singh</div>
      <span class="sub-name">✨ sorry ✨</span>
    </div>

    <!-- minimal but strong sorry message -->
    <div class="sorry-message">
      <div class="sorry-word">SORRY</div>
      <div class="heart-icon">🤍</div>
    </div>

    <!-- little decorative dots -->
    <div class="dot-divider">
      <i></i>
      <i></i>
      <i></i>
    </div>

    <!-- soft footnote — no big text, just gentle reminder -->
    <div class="footnote">
      truly sorry, aryuu 🥲👉👈
    </div>

  </div>

</body>
</html>
